# 念册 · Memora — 自托管
# 开发口令仅用于本机，必须用 .env 覆盖后再暴露到非本机。
# 数据端口全部绑定 127.0.0.1。云模式不要用本文件里的 Postgres / MinIO 当生产库。
# `docker compose up -d` 只起 Postgres / Redis / MinIO / ML。
# 一键起整套（含 web / api / worker）：docker compose --profile app up -d --build
name: memora

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora-dev-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-memora}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memora} -d ${POSTGRES_DB:-memora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - memora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memora-dev-change-me}
      # 社区版没有按桶 CORS。只放行本机页面，浏览器才能 PUT 原图、GET 衍生图。
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://127.0.0.1:3000,http://localhost:3000}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - memora_minio_data:/data
    healthcheck:
      # 官方镜像自带 mc；curl 在该镜像里不一定存在
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memora-dev-change-me}
      S3_BUCKET: ${S3_BUCKET:-memora-local}
    volumes:
      - ./deploy/self-host/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"

  # CPU 推理桩。镜像里没有 GPU 运行时。
  ml:
    build: ./services/ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 容器内进程要听 0.0.0.0，宿主机端口映射才进得去。
  # 映射地址写 127.0.0.1，不要改成 0.0.0.0。Worker 健康端口不映射出来。
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/self-host/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOY_MODE: ${DEPLOY_MODE:-selfhost}
      MEMORA_ENV: ${MEMORA_ENV:-local}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-memora-dev-change-me}@postgres:5432/${POSTGRES_DB:-memora}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-memora-local}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-memora}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-memora-dev-change-me}
      S3_FORCE_PATH_STYLE: "true"
      PRESIGN_TTL_MINUTES: ${PRESIGN_TTL_MINUTES:-10}
      WEB_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      # 本机 HTTP。放到 HTTPS 反代后面再改成 true，否则浏览器不会保存会话。
      COOKIE_SECURE: "false"
      AUTH_REGISTRATION: ${AUTH_REGISTRATION:-open}
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/self-host/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DEPLOY_MODE: ${DEPLOY_MODE:-selfhost}
      MEMORA_ENV: ${MEMORA_ENV:-local}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      DATABASE_URL: postgresql://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-memora-dev-change-me}@postgres:5432/${POSTGRES_DB:-memora}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-memora-local}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-memora}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-memora-dev-change-me}
      S3_FORCE_PATH_STYLE: "true"
      PRESIGN_TTL_MINUTES: ${PRESIGN_TTL_MINUTES:-10}
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: "3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/self-host/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  memora_pg_data:
  memora_redis_data:
  memora_minio_data:
