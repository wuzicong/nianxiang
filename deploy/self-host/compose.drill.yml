# 备份恢复演练专用。项目名 memora-backup-drill，不映射宿主机端口。
# 不会使用开发项目 memora 或生产项目 memora-prod 的卷。
# 口令由 restore-drill.sh 注入，这个文件里没有默认口令。

name: memora-backup-drill

services:
  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: missing
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: ${DRILL_POSTGRES_PASSWORD:?DRILL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: memora
    volumes:
      - drill_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 2s
      timeout: 5s
      retries: 40
    networks:
      - drill

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    pull_policy: missing
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: memora
      MINIO_ROOT_PASSWORD: ${DRILL_MINIO_ROOT_PASSWORD:?DRILL_MINIO_ROOT_PASSWORD is required}
    volumes:
      - drill_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s
    networks:
      - drill

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    pull_policy: missing
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: memora
      MINIO_ROOT_PASSWORD: ${DRILL_MINIO_ROOT_PASSWORD:?DRILL_MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: memora-local
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
      - ./minio-cors.xml:/minio-cors.xml:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"
    networks:
      - drill

networks:
  drill:

volumes:
  drill_pg:
  drill_minio:
