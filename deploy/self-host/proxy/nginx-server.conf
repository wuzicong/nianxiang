# 放进 server 块，不要放进 location。
# 这一行盖住从 http 继承来的 access_log。不要在同一个 server 再加 combined，
# 否则未打码的那份日志还在。日志目录不要对所有用户可读。
access_log /var/log/nginx/access.log memora_redacted;

# 限流拒绝默认会把原始请求行写进 error_log。降到 info 后，
# 只要 error_log 停在 warn 或更高（Nginx 默认是 error），拒绝请求不会落盘。
# 不要把 error_log 调到 info 或 debug。上游失败时 error_log 仍可能带原始路径，
# 因为 Nginx 不能改 error_log 的格式；那份日志入库前要用同一条正则打码。
limit_req_log_level info;
limit_req_status 429;

# 正则 location 优先于前缀 location。解锁写在前面，避免被公开分享前缀抢走。
# 两条都转到 memora_web（本机 Web :3000，由 Web 再转 API）。
# API 若单独暴露，把 proxy_pass 改到那一跳，不要让它绕过这里。
location ~ "^/api/v1/public/shares/[A-Za-z0-9_-]{43}/unlock/?$" {
    limit_req zone=memora_share_unlock burst=6 nodelay;
    limit_req zone=memora_public_shares burst=20 nodelay;
    client_max_body_size 4k;
    client_body_buffer_size 8k;
    error_page 429 @memora_rate_limited;
    proxy_pass http://memora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location ~ "^/api/v1/public/shares/" {
    limit_req zone=memora_public_shares burst=20 nodelay;
    error_page 429 @memora_rate_limited;
    proxy_pass http://memora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# 登录、注册。密码在 JSON 正文里。
# 访问日志沿用 server 上的 memora_redacted，不要在这里再写 access_log，也不要记 $request_body。
location ~ "^/api/v1/auth/(login|register)/?$" {
    limit_req zone=memora_auth burst=4 nodelay;
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    error_page 429 @memora_rate_limited;
    proxy_pass http://memora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location @memora_rate_limited {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 429 '{"error":"rate_limited","message":"请稍后再试"}';
}
