# 放进 http 块，只 include 一次。
# 打码的是访问日志里的分享能力令牌：32 字节 base64url、无填充，固定 43 位。
# 只处理 /s/ 和 /api/v1/public/shares/ 后面刚好 43 位的那一段。更短的不是令牌，原样保留。
# 查询串里的 password、token 一并打掉。不要在 log_format 里加 $request、$request_body 或 $http_referer。

map $uri $memora_log_path {
    default $uri;
    "~^(.*)(/(?:api/v1/public/shares|s)/)[A-Za-z0-9_-]{43}([^A-Za-z0-9_-].*|)$" "$1$2***$3";
}

# $args 没有前导 ?。第一处 password 或 token 会被打掉。
map $args $memora_log_args {
    default $args;
    "~^(.*?)((?:^|&)(?:password|token)=)[^&]*(.*)$" "$1$2***$3";
}

map $http_referer $memora_referer_token {
    default $http_referer;
    "~^(.*)(/(?:api/v1/public/shares|s)/)[A-Za-z0-9_-]{43}([^A-Za-z0-9_-].*|)$" "$1$2***$3";
}

map $memora_referer_token $memora_referer_query {
    default $memora_referer_token;
    "~^(.*?)([?&](?:password|token)=)[^&]*(.*)$" "$1$2***$3";
}

map $memora_referer_query $memora_log_referer {
    ""      "-";
    default $memora_referer_query;
}

log_format memora_redacted '$remote_addr - $remote_user [$time_local] '
    '"$request_method $memora_log_path$is_args$memora_log_args $server_protocol" '
    '$status $body_bytes_sent "$memora_log_referer" "$http_user_agent"';

# 解锁偏紧，公开分享前缀松一些。按来源地址计数，可以改。
# Nginx 的 burst 是超额名额：短时能过的大约是 1+burst。
# 解锁 6r/m、burst=6：短时大约 7 次，第 8 次 429，之后按每分钟 6 次恢复。
# 公开分享 60r/m、burst=20：短时大约 21 次，之后按每分钟 60 次恢复。
# 出口 IP 若很多人共用，把 rate 和 burst 调高。
limit_req_zone $binary_remote_addr zone=memora_share_unlock:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=memora_public_shares:10m rate=60r/m;

upstream memora_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 只有上一跳是你自己的负载均衡才打开，并写成那一跳的网段。
# 不要信任浏览器自己带的 X-Forwarded-For，否则限流可以被伪造来源绕过。
